name: Publish main container

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/publish-main-image.yml
  workflow_dispatch:

concurrency:
  group: publish-main-container
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: caprol55555/onwatch

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run project smoke checks
        run: ./app.sh --smoke

  publish:
    name: Build and publish linux/amd64 image
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build metadata
        id: build
        shell: bash
        run: |
          base_version="$(tr -d '\r\n' < VERSION)"
          echo "version=${base_version}-caprol.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - name: Build and push Alpine image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime-shell
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            BUILD_TIME=${{ steps.build.outputs.build_time }}
          cache-from: type=gha,scope=main-amd64
          cache-to: type=gha,mode=max,scope=main-amd64
